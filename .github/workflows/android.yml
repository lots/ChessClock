name: Android APK

# 打出安卓调试版 APK。
#
# 为什么放在 CI：APK 是构建产物（Godot/build/ 被 .gitignore 排除了），
# 让 CI 现场编译就不会把二进制塞进仓库历史；打 tag 时顺便挂到 Release 上，
# 手机直接下就行。
#
# 触发方式：
#   · Actions → 本工作流 → Run workflow（手动，产物在 Artifacts 里）
#   · push 一个 v* 标签（例如 v1.0.0）：会建/更新同名的 GitHub Release 并附上 APK
#
# 说明：
#   · 用的是工程里 `use_gradle_build=false` 的非 Gradle 导出路径（导出模板里自带构建好的 APK），
#     所以 CI 只需要 JDK + Android SDK 的 build-tools，不需要 NDK/CMake；
#   · 导出模板约 1 GB，这一步是这个工作流最慢的地方；
#   · 产物是 **debug 签名**（`~/.android/debug.keystore`）。自己装、发朋友够用；
#     要上架应用商店得换 release keystore，那属于另一件事。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1-stable
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (build-tools + platform, no NDK needed)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

          curl -sSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # Godot 期望的目录名是 4.5.1.stable（下载文件名里是 4.5.1-stable，只差一个分隔符）
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates"
          # tpz 解压出来是 templates/ 一层，直接挪进上面那个版本目录
          if [ -d "$HOME/.local/share/godot/export_templates/templates" ]; then
            mv "$HOME/.local/share/godot/export_templates/templates/"* "$tpl_dir/"
            rmdir "$HOME/.local/share/godot/export_templates/templates"
          fi
          ls "$tpl_dir" | head -20

      - name: Create the debug keystore Godot expects
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import project (needed before any export)
        run: ./godot --headless --path Godot --import

      - name: Export debug APK
        run: |
          mkdir -p out
          ./godot --headless --path Godot --export-debug "Android" "$PWD/out/CoQChessClock-debug.apk"
          ls -lh out/

      - name: Smoke-test the exported package (engine + UI self-check)
        run: |
          ./godot --headless --path Godot --export-pack "Android" "$PWD/out/verify.pck"
          ./godot --headless --main-pack "$PWD/out/verify.pck" --quit-after 120 -- \
            --reset-settings --debug-input | tee run.log
          grep -q "DBG ui preset_select=true" run.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coq-chess-clock-android-debug
          path: out/CoQChessClock-debug.apk
          if-no-files-found: error

      - name: Attach the APK to the Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/CoQChessClock-debug.apk
          body: |
            Android **debug** build of CoQ Chess & Weiqi Clock (arm64-v8a, minSdk 24, targetSdk 35).

            Install with `adb install -r CoQChessClock-debug.apk`, or copy the file to the phone and tap it
            (allow "install unknown apps" for your file manager). It is signed with the standard Android
            debug key, so it coexists with nothing else and cannot be updated from a Play Store build.

            Prefer no install at all? The web version is the same clock and runs from a phone browser:
            open the Pages site (if enabled) or host this folder anywhere static. See the README.
