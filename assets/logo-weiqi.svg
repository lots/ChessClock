<?xml version="1.0" encoding="UTF-8"?>
<!--
  logo-weiqi.svg —— 围棋（Weiqi / Go）标志
  ================================================================
  设计说明
  · 与 app 其它图标同一套几何：64×64 画布、圆角方块底（rx 15）;
  · 木色棋盘 + 网格 + 一黑一白两颗棋子：围棋最直接的视觉符号，
    不需要任何文字，32px 下也能认出是棋盘;
  · 左右两颗棋子对称摆放，同样呼应棋钟的双表盘。

  重新导出 PNG：node tools/export-logos.js
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512"
     role="img" aria-labelledby="goTitle goDesc">
  <title id="goTitle">围棋 · Weiqi (Go)</title>
  <desc id="goDesc">木色圆角方块棋盘，深色网格，左右各一颗黑白棋子。</desc>

  <defs>
    <linearGradient id="goWood" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#f7dfb8"/>
      <stop offset="0.5" stop-color="#e8c288"/>
      <stop offset="1" stop-color="#d3a15c"/>
    </linearGradient>
    <radialGradient id="goStoneB" cx="0.33" cy="0.27" r="0.82">
      <stop offset="0" stop-color="#6b6b6b"/>
      <stop offset="0.45" stop-color="#232323"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="goStoneW" cx="0.33" cy="0.27" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f6f7f8"/>
      <stop offset="1" stop-color="#d8dde3"/>
    </radialGradient>
  </defs>

  <!-- 底：木色圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#goWood)"/>
  <rect x="2" y="2" width="60" height="60" rx="15"
        fill="none" stroke="#7a4a14" stroke-opacity="0.14" stroke-width="1"/>

  <!-- 棋盘网格：5×5 条线，落在圆角底内 -->
  <g stroke="#5b3d16" stroke-opacity="0.46" stroke-width="0.85">
    <path d="M14 14v36M23 14v36M32 14v36M41 14v36M50 14v36"/>
    <path d="M14 14h36M14 23h36M14 32h36M14 41h36M14 50h36"/>
  </g>

  <!-- 星位 -->
  <circle cx="32" cy="32" r="1" fill="#5b3d16" fill-opacity="0.55"/>

  <!-- 黑棋（左） -->
  <circle cx="23" cy="32" r="5.5" fill="url(#goStoneB)"
          stroke="#2b1c09" stroke-opacity="0.35" stroke-width="0.7"/>
  <ellipse cx="21.1" cy="29.9" rx="1.7" ry="1.2" fill="#ffffff" opacity="0.28"
           transform="rotate(-25 21.1 29.9)"/>

  <!-- 白棋（右） -->
  <circle cx="41" cy="32" r="5.5" fill="url(#goStoneW)"
          stroke="#8d97a2" stroke-opacity="0.55" stroke-width="0.7"/>
  <ellipse cx="39.1" cy="29.9" rx="1.5" ry="1" fill="#ffffff" opacity="0.85"
           transform="rotate(-25 39.1 29.9)"/>
</svg>

